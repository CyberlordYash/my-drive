server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same SPA-fallback problem as the Vercel rewrite in vercel.json: a
    # hard refresh on a client-side route like /s/<token> or /drive/<id>
    # must still resolve to index.html, or nginx 404s it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
