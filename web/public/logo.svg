<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282a2c"/>
      <stop offset="100%" stop-color="#1b1b1b"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab4f8"/>
      <stop offset="100%" stop-color="#0842a0"/>
    </linearGradient>
  </defs>

  <!-- rounded app-icon backing, matching the dark surface tokens -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#444746" stroke-width="2"/>

  <!-- stylized folder tab, cut corner echoes a "page/file" -->
  <path
    d="M32 40
       h20 l8 10 h36
       a8 8 0 0 1 8 8
       v30
       a8 8 0 0 1 -8 8
       H32
       a8 8 0 0 1 -8 -8
       V48
       a8 8 0 0 1 8 -8 Z"
    fill="url(#fold)"
  />

  <!-- upward chevron = "upload" motif, ties back to the drop-zone icon in-app -->
  <path
    d="M64 58 L78 72 H70 V86 H58 V72 H50 Z"
    fill="#1b1b1b"
    opacity="0.85"
  />
</svg>
