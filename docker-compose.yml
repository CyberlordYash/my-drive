name: drive

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. This is what lets `docker compose up`
  # exercise the REAL S3Adapter code path (same class that talks to AWS in
  # prod) with zero AWS account required — proof the storage abstraction
  # isn't decorative.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drive-minio
      MINIO_ROOT_PASSWORD: drive-minio-secret
    ports:
      - '9001:9001' # MinIO console, optional — inspect uploaded objects at http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init container: creates the bucket and applies a CORS policy,
  # then exits. `api` waits on this via depends_on/service_completed_successfully.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 drive-minio drive-minio-secret &&
      mc mb --ignore-existing local/drive-uploads &&
      echo 'MinIO bucket ready'
      "

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:8080
      COOKIE_DOMAIN: ''
      MONGODB_URI: mongodb://mongo:27017/drive
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-this-is-not-a-secret-32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in a .env file at the repo root}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in a .env file at the repo root}
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/auth/google/callback
      # STORAGE_DRIVER=s3 pointed at MinIO — this is the point of this file.
      # Flip to `local` (and drop the S3_* vars) to exercise LocalDiskAdapter
      # instead; the app behaves identically either way.
      STORAGE_DRIVER: s3
      S3_BUCKET: drive-uploads
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: drive-minio
      S3_SECRET_ACCESS_KEY: drive-minio-secret
      S3_FORCE_PATH_STYLE: 'true'
    volumes:
      - drive-uploads:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  mongo-data:
  minio-data:
  drive-uploads:
