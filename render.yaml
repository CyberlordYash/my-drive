# Render Blueprint — commits the backend's infrastructure as code. Import
# this repo at render.com/blueprints to provision the API service. See
# README.md "Deployment" for the full step-by-step (this alone doesn't
# create the Google OAuth credentials or the MongoDB Atlas cluster).
services:
  - type: web
    name: drive-api
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PUBLIC_URL
        value: https://api.yashsachan.com
      - key: WEB_ORIGIN
        value: https://drive.yashsachan.com
      - key: COOKIE_DOMAIN
        value: .yashsachan.com
      - key: MONGODB_URI
        sync: false # set from the Atlas connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://api.yashsachan.com/api/auth/google/callback
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_FILE_SIZE_BYTES
        value: 104857600
      - key: USER_QUOTA_BYTES
        value: 16106127360
      - key: LOG_LEVEL
        value: info
